<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OncoScan - Klasifikasi Kanker Payudara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#272729"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0066cc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#0066cc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <clipPath id="breast"><path d="M900 52 C1010 50 1100 100 1112 160 C1100 222 1010 270 900 268 Z"/></clipPath>
  <circle cx="1000" cy="160" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;185;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- penampang klinis (skematik) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#6e6e73" stroke-width="3">
      <path d="M880 40 L880 280"/><path d="M866 78 C876 70 884 70 892 78"/><path d="M866 160 C876 152 884 152 892 160"/><path d="M866 242 C876 234 884 234 892 242"/>
    </g>
    <path d="M900 52 C1010 50 1100 100 1112 160 C1100 222 1010 270 900 268" stroke="#2997ff" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </path>
    <g stroke="#ff6fa5" stroke-width="2" opacity="0.85">
      <path d="M1112 160 C1060 160 1020 160 960 160"/>
      <path d="M1040 160 C1010 130 990 112 950 108"/><path d="M1040 160 C1010 190 990 208 950 212"/>
      <path d="M990 160 C960 150 940 140 918 128"/><path d="M990 160 C960 172 940 182 918 196"/>
      <path d="M950 108 C938 96 930 90 920 86"/><path d="M950 212 C938 224 930 230 920 236"/>
    </g>
    <g stroke="#ff6fa5" stroke-width="2">
      <circle cx="918" cy="84" r="7"/><circle cx="944" cy="94" r="6"/><circle cx="912" cy="128" r="7"/><circle cx="912" cy="196" r="7"/>
      <circle cx="944" cy="228" r="6"/><circle cx="918" cy="238" r="7"/><circle cx="960" cy="108" r="6"/><circle cx="960" cy="212" r="6"/>
    </g>
    <g clip-path="url(#breast)">
      <line x1="0" y1="40" x2="0" y2="280" stroke="#2997ff" stroke-width="3" stroke-opacity="0.9">
        <animate attributeName="x1" values="890;1115;890" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="890;1115;890" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
  <!-- benjolan -->
  <circle cx="1010" cy="160" r="14" fill="#ff375f"/>
  <circle cx="1010" cy="160" r="14" fill="none" stroke="#ff375f" stroke-width="2">
    <animate attributeName="r" values="14;38" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="160" r="26" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- pita kesadaran -->
  <g transform="translate(1140 58)">
    <path d="M0 0 C-14 -14 -12 -34 0 -34 C12 -34 14 -14 0 0 Z M0 0 C-10 14 -18 26 -24 36 M0 0 C10 14 18 26 24 36" fill="none" stroke="#ff6fa5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M0 268 L260 268 L290 268 L310 252 L336 304 L360 244 L384 268 L1200 268"
        fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" values="1400;0;0;-1400" keyTimes="0;0.45;0.65;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="70" y="148" font-size="84" font-weight="700" letter-spacing="-2" opacity="0">OncoScan
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
      <animate attributeName="y" values="170;148" dur="1s" fill="freeze"/>
    </text>
    <text x="74" y="196" font-size="26" fill="#a1a1a6" opacity="0">Klasifikasi Kanker Payudara dengan Machine Learning
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="74" y="232" font-size="18" fill="#2997ff" opacity="0">Random Forest  ·  Streamlit  ·  Breast Cancer Wisconsin (Diagnostic)
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
